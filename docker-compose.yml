# Production stack for the podcast app. Runs the three services this repo
# owns — backend API, worker, frontend. Supabase and LiveKit are self-hosted
# separately on the same VPS and reached by URL.
#
# Ports bind to 127.0.0.1 only; the host nginx (vhost
# podcast.abdallahhelal.com) proxies them over TLS.
#
# Host port bindings default to 3000/8000 but can be overridden in .env with
# FRONTEND_PORT / BACKEND_PORT when those are already taken on the box (our
# shared VPS runs Supabase Studio on 3000 and Supabase Kong on 8000, so this
# deployment uses 3001/8100 — matched by the nginx upstream block).
#
# Secrets live in .env at the repo root — never commit it.

services:
  backend:
    build:
      context: ./backend
    container_name: podcast-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      # /ready checks Supabase + LiveKit reachability, not just that the
      # process is up. Failing deps mark the container unhealthy so a load
      # balancer can keep it out of rotation.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/ready').status == 200 else 1)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 15s

  worker:
    build:
      context: ./worker
    container_name: podcast-worker
    restart: unless-stopped
    env_file: .env
    volumes:
      # Persist the Whisper model download across restarts.
      - hf-cache:/root/.cache/huggingface
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
        # NEXT_PUBLIC_* is inlined at BUILD time, so Sentry DSN must come in
        # as a build arg — not just an env_file reference at runtime.
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${NEXT_PUBLIC_SENTRY_ENVIRONMENT:-production}
    container_name: podcast-frontend
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"

volumes:
  hf-cache:
