# FastAPI backend
# Drop into /etc/nginx/sites-available/, symlink to sites-enabled/, run
# `certbot --nginx -d api.abdallahhelal.com` to issue the cert, then reload.

server {
    listen 80;
    listen [::]:80;
    server_name api.abdallahhelal.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.abdallahhelal.com;

    ssl_certificate /etc/letsencrypt/live/api.abdallahhelal.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.abdallahhelal.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # No upload-via-API — the browser hits Supabase Storage directly over TUS.
    # 10 MB is plenty for JSON bodies (join tokens, metadata).
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
