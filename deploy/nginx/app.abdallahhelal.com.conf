# Next.js frontend
# Drop into /etc/nginx/sites-available/, symlink to sites-enabled/, run
# `certbot --nginx -d app.abdallahhelal.com` to issue the cert, then reload.

server {
    listen 80;
    listen [::]:80;
    server_name app.abdallahhelal.com;

    # certbot writes its ACME challenges here; the TLS redirect below lets them
    # through.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.abdallahhelal.com;

    # certbot fills these in on `certbot --nginx -d app.abdallahhelal.com`.
    ssl_certificate /etc/letsencrypt/live/app.abdallahhelal.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.abdallahhelal.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # The browser uploads batches (up to ~64 MB) through TUS. Supabase itself
    # is on a different subdomain, but keep this generous so Next.js doesn't
    # choke on large POST bodies if we ever add server actions.
    client_max_body_size 128M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Next.js uses websockets for HMR in dev and for the preview channel
        # in prod; keep these headers even though prod is mostly HTTP.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
