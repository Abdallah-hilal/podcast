# LiveKit signaling (WebSocket) + HTTP API
#
# LiveKit's data plane (WebRTC media) goes DIRECT between the browser and the
# livekit-server process over UDP — nginx is NOT in that path. nginx only
# terminates TLS on the control plane (ws:// upgrades to wss://).
#
# Ports to open on the host (UFW):
#   443/tcp   — this reverse proxy
#   50000-60000/udp   — WebRTC media (media.rtc_config.port_range in livekit.yaml)
#   7881/tcp   — ICE/TCP fallback (optional, for clients behind strict firewalls)
#
# The underlying livekit-server must bind on 127.0.0.1:7880 (and 7881 for
# ICE/TCP if you enable it); it is reached only through this proxy.
#
# Drop into /etc/nginx/sites-available/, symlink, run
# `certbot --nginx -d livekit.abdallahhelal.com`, reload.

server {
    listen 80;
    listen [::]:80;
    server_name livekit.abdallahhelal.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name livekit.abdallahhelal.com;

    ssl_certificate /etc/letsencrypt/live/livekit.abdallahhelal.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/livekit.abdallahhelal.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Everything here is tiny JSON + WS frames; the big bytes travel over UDP.
    client_max_body_size 1M;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade — the signaling channel lives on wss://.../rtc
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Signaling is long-lived; a short timeout silently drops meetings.
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
