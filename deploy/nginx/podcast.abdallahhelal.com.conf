# Single-subdomain vhost for the podcast app.
#
# One origin serves three logical services via path routing:
#   /                 -> Next.js frontend on 127.0.0.1:3000
#   /api/*            -> FastAPI backend on 127.0.0.1:8000
#   /health, /ready   -> backend liveness/readiness probes (root paths on API)
#   /livekit/*        -> LiveKit WebSocket signaling on 127.0.0.1:7880
#                         (the /livekit prefix is stripped before forwarding)
#
# LiveKit media still goes directly to UDP 7882 on the host; nginx isn't
# involved in that path.
#
# Deploy:
#   1. Copy to /etc/nginx/sites-available/podcast.abdallahhelal.com.conf
#   2. Symlink into sites-enabled/, `nginx -t && systemctl reload nginx`
#   3. Only after DNS resolves:
#      certbot --nginx -d podcast.abdallahhelal.com

upstream podcast_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream podcast_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name podcast.abdallahhelal.com;

    # certbot writes ACME challenges here; the TLS redirect below lets them
    # through.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name podcast.abdallahhelal.com;

    # certbot fills these in on `certbot --nginx -d podcast.abdallahhelal.com`.
    ssl_certificate /etc/letsencrypt/live/podcast.abdallahhelal.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/podcast.abdallahhelal.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # The browser never POSTs recording batches through here (they go directly
    # to Supabase Storage via TUS), but keep the limit generous so an occasional
    # server-action payload doesn't 413.
    client_max_body_size 128M;

    # Shared proxy headers for every upstream below.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # -------- Backend API --------
    location /api/ {
        proxy_pass http://podcast_backend;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Backend health probes live at the root of the API process. Route them
    # explicitly so they don't fall through to the frontend.
    location = /health {
        proxy_pass http://podcast_backend;
    }
    location = /ready {
        proxy_pass http://podcast_backend;
    }

    # -------- LiveKit signaling --------
    # The trailing slash on proxy_pass + location strips the /livekit prefix,
    # so /livekit/rtc on the client becomes /rtc on the LiveKit server.
    # Media (UDP 7882) stays off nginx and goes direct to the host.
    location /livekit/ {
        proxy_pass http://127.0.0.1:7880/;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # LiveKit's signaling WS idles between messages; a short read timeout
        # would drop the connection mid-call.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # -------- Frontend (everything else) --------
    location / {
        proxy_pass http://podcast_frontend;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }
}
