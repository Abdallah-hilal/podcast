# Minimal livekit-server config for a single VPS running behind nginx.
#
# Place at /opt/livekit/livekit.yaml and run:
#   livekit-server --config /opt/livekit/livekit.yaml
# (or install deploy/systemd/livekit-server.service beside this file.)
#
# Both api_key and api_secret here must match LIVEKIT_API_KEY and
# LIVEKIT_API_SECRET in the podcast repo's .env, so the backend can mint
# tokens the server accepts. Generate new values and keep them server-side.

port: 7880

rtc:
  # Public IP of the VPS — browsers need a reachable candidate for WebRTC
  # media. Set once; livekit cannot auto-detect this reliably behind nginx.
  use_external_ip: true
  # UDP media port range. Open these in UFW.
  port_range_start: 50000
  port_range_end: 60000
  # Optional TCP fallback for clients behind UDP-blocking firewalls. Also
  # open this in UFW if you enable it.
  tcp_port: 7881

keys:
  # Generate with: openssl rand -hex 32
  devkey: change-me-at-least-32-chars

logging:
  level: info
  json: false
